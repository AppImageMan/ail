app: Alacritty
union: true

ingredients:
  dist: focal
  sources:
    - deb http://us.archive.ubuntu.com/ubuntu/ focal main universe # works for amd64
    - deb http://ports.ubuntu.com/ubuntu-ports/ focal main universe # works for arm64

script:
  - ls
  - cat > neovim.desktop <<\EOF
  - [Desktop Entry]
  - Type=Application
  - Name=Alacritty
  - TryExec=alacritty
  - Exec=alacritty
  - Icon=alacritty
  - Categories=System;TerminalEmulator;
  - Comment=A fast, cross-platform, OpenGL terminal emulator
  - EOF
  - wget -c https://raw.githubusercontent.com/alacritty/alacritty/refs/heads/master/extra/logo/alacritty-simple.svg -O alacritty.svg
  - mkdir -p usr/share/icons/hicolor/256x256/apps/
  - cp alacritty.svg usr/share/icons/hicolor/256x256/apps/alacritty.svg
